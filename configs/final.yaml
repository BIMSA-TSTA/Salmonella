
seed: 42
cv_folds: 5

# HSS-SHAPi
bootstrap_replicates: 1000
permutation_replicates: 1000
top_shap_genes: 100
stability_threshold: 0.99
direction_consistency_threshold: 0.80

# Multiple testing
fdr_method: benjamini-hochberg
fdr_threshold: 0.10

# Prediction
decision_threshold: 0.50
hosts:
  - human
  - pig
  - chicken

# SHAP
shap_version: 0.49.1
shap_model_output: probability
shap_background: none
shap_feature_perturbation: tree_path_dependent
